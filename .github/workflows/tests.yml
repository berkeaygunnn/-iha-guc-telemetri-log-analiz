name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backend'i derle
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          cmake -S backend -B backend/build -G Ninja
          cmake --build backend/build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend testleri
        run: python3 backend/tests/run_tests.py

      - name: Frontend bağımlılıkları
        run: pip install -r frontend/requirements.txt

      - name: Anomali tespiti birim testleri (Tk gerektirmez)
        run: |
          python3 frontend/tests/test_flight_series.py
          python3 frontend/tests/test_resample.py
          python3 frontend/tests/test_anomaly_features.py
          python3 frontend/tests/test_anomaly_spectral.py
          python3 frontend/tests/test_anomaly_detect.py
          python3 frontend/tests/test_battery_resistance.py
          python3 frontend/tests/test_pwm_saturation.py

      - name: xvfb ve python3-tk kur (Tkinter/CustomTkinter için gerekli)
        run: sudo apt-get install -y xvfb python3-tk

      - name: Frontend duman testi
        run: xvfb-run -a python3 frontend/tests/test_smoke.py

  test-windows:
    # Windows'a özgü kod yollarını (main.cpp'deki _WIN32 blokları: UTF-8
    # argv çevirisi, fs::u8path) hiç çalıştırmayan tek CI job'ıydı; sadece
    # backend derleme+test burada, frontend/GUI testi kapsam dışı (Tkinter
    # için Windows runner'da display kurulumu ayrı bir efor).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backend'i derle
        run: |
          cmake -S backend -B backend/build
          cmake --build backend/build --config Release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend testleri
        run: python backend/tests/run_tests.py
